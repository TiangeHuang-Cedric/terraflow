[workspace]
name = "terraflow"
channels = ["pypi", "conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
bokeh = ">=3.9.2,<4"
cartopy = ">=0.25.0,<0.26"
compilers = ">=1.7.0,<3"
easygems = ">=0.2.1,<0.3"
esmpy = ">=8.8.1,<9"
holoviews = ">=1.21.0"
ipykernel = ">=7.3.0,<8"
netcdf4 = ">=1.7.2,<2"
numba = ">=0.66.0,<0.67"
openmpi = ">=5.0.8,<6"
panel = ">=1.9.3,<2"
pip = ">=26.2.1,<27"
python = ">=3.12,<3.13"
uxarray = ">=2025.11.0"

[pypi-dependencies]
equinox = ">=0.13.8, <0.14"
jaxtyping = ">=0.3.11, <0.4"
jupytext = ">=1.19.5, <2"
loguru = ">=0.7.3, <0.8"
numpy = "*"
polars = "*"
pytest = ">=9.1.1, <10"
quadax = ">=0.2.13, <0.3"
tree-math = ">=0.2.1, <0.3"
unxt = ">=2.0.1, <3"
xarray = "*"
pymetis = ">=2025.2.2, <2026"
mpi4py = ">=4.1.2, <5"
nanobind = ">=2.14.0, <3"
mpi4jax = ">=0.9.1, <0.10"

[feature.cpu]
system-requirements = { libc = "2.27" }
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
dependencies = { jax = ">=0.10.2,<0.11" }

[feature.cpu.pypi-dependencies]
jaxkd = ">=0.1.2, <0.2"

[feature.cuda]
system-requirements = { cuda = "12", libc = "2.27" }
platforms = ["linux-64", "linux-aarch64"]
dependencies = { cuda = ">=12.1.1,<13" }

[feature.cuda.pypi-dependencies]
jax = { version = ">=0.10.2, <0.11", extras = ["cuda12"] }
jaxkd = ">=0.1.2, <0.2"

[tasks]
build-mpi4jax = "pip uninstall -y mpi4jax; pip install --no-build-isolation 'mpi4jax>=0.9.0.post1,<0.10'"

[environments]
default = { features = ["cpu"] }
cuda = { features = ["cuda"] }
