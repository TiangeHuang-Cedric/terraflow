[workspace]
name = "terraflow"
channels = ["pypi", "conda-forge"]
requires-pixi = ">=0.71.0"
platforms = [
    { name = "osx-arm64-macos-14", platform = "osx-arm64", macos = "14.0" },
    { name = "linux-64-glibc-2-27", platform = "linux-64", glibc = "2.27" },
    { name = "linux-aarch64-glibc-2-27", platform = "linux-aarch64", glibc = "2.27" },
    { name = "linux-64-cuda-12-glibc-2-27", platform = "linux-64", cuda = "12", glibc = "2.27" },
    { name = "linux-aarch64-cuda-12-glibc-2-27", platform = "linux-aarch64", cuda = "12", glibc = "2.27" },
]

[dependencies]
bokeh = ">=3.9.2,<4"
cartopy = ">=0.25.0,<0.26"
easygems = ">=0.2.1,<0.3"
esmpy = ">=8.8.1,<9"
holoviews = ">=1.21.0"
ipykernel = ">=7.3.0,<8"
netcdf4 = ">=1.7.2,<2"
numba = ">=0.66.0,<0.67"
panel = ">=1.9.3,<2"
pip = ">=26.2.1,<27"
python = ">=3.12,<3.13"
uxarray = "==2026.08.1"
xarray = "==2025.9.0"

[pypi-dependencies]
equinox = ">=0.13.8, <0.14"
jaxtyping = ">=0.3.11, <0.4"
jupytext = ">=1.19.5, <2"
loguru = ">=0.7.3, <0.8"
nanobind = ">=2.14.0, <3"
numpy = "*"
polars = "*"
pymetis = ">=2025.2.2, <2026"
pytest = ">=9.1.1, <10"
quadax = ">=0.2.13, <0.3"
tree-math = ">=0.2.1, <0.3"
unxt = ">=2.0.1, <3"

[target.osx-arm64.pypi-dependencies]
jax-mps = "==0.10.10"

[feature.cpu]
platforms = ["osx-arm64-macos-14", "linux-64-glibc-2-27", "linux-aarch64-glibc-2-27"]
dependencies = { jax = "==0.10.2" }

[feature.cpu.pypi-dependencies]
jaxkd = ">=0.1.2, <0.2"

[feature.cpu.tasks]
build-mpi4jax = { cmd = """
python -m pip uninstall -y mpi4jax mpi4py
MPICC=${MPICC:-$(which mpicc)} python -m pip install --no-cache-dir --no-binary=mpi4py --force-reinstall 'mpi4py>=4.1.2,<5'
MPI4JAX_USE_CUDA_MPI=${MPI4JAX_USE_CUDA_MPI:-0} MPICC=${MPICC:-$(which mpicc)} python -m pip install --no-deps --no-build-isolation --no-cache-dir --no-binary=mpi4jax --force-reinstall 'mpi4jax==0.9.1'
""" }

[feature.cuda]
platforms = ["linux-64-cuda-12-glibc-2-27", "linux-aarch64-cuda-12-glibc-2-27"]
dependencies = { cuda = ">=12.1.1,<13" }

[feature.cuda.pypi-dependencies]
jax = { version = "==0.10.2", extras = ["cuda12"] }
jaxlib = "==0.10.2"
jax-cuda12-plugin = { version = "==0.10.2", extras = ["with-cuda"] }
jax-cuda12-pjrt = "==0.10.2"
jaxkd = ">=0.1.2, <0.2"

[feature.cuda.tasks]
build-mpi4jax = { cmd = """
python -m pip uninstall -y mpi4jax mpi4py
MPICC=${MPICC:-$(which mpicc)} python -m pip install --no-cache-dir --no-binary=mpi4py --force-reinstall 'mpi4py>=4.1.2,<5'
MPI4JAX_USE_CUDA_MPI=${MPI4JAX_USE_CUDA_MPI:-1} MPICC=${MPICC:-$(which mpicc)} python -m pip install --no-deps --no-build-isolation --no-cache-dir --no-binary=mpi4jax --force-reinstall 'mpi4jax==0.9.1'
""" }

[tasks]
install-xprof = { cmd = "python -m pip install --no-cache-dir xprof", clean-env = true }

[environments]
default = { features = ["cpu"] }
cuda = { features = ["cuda"] }
