[workspace]
name = "terraflow"
channels = ["pypi", "conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
python = ">=3.11, <3.12"
pip = "*"
bokeh = "==3.8"
cartopy = ">=0.25.0, <1.0"
easygems = ">=0.1.2"
holoviews = ">=1.21.0, <=1.22.0"
ipykernel = ">=7.1.0"
netcdf4 = "<1.7.3"
panel = "==1.8.0"
uxarray = "==2025.11.0"
openmpi = ">=4.1.4, <6"

[pypi-dependencies]
equinox = ">=0.13.2"
jaxtyping = ">=0.3.4"
jupytext = ">=1.18.1"
loguru = ">=0.7.3"
numpy = ">=2.2.6, <2.3"
polars = ">=1.36.1"
pytest = ">=9.0.2"
quadax = ">=0.2.11"
tree-math = ">=0.2.1"
unxt = "==1.7.7"
xarray = ">=2025.12.0"
pymetis = ">=0.1.7"
cython = ">=3.2.4, <4"
mpi4py = ">=4.1.1, <5"
mpi4jax = ">=0.8.1, <0.9"

[feature.cpu]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
dependencies = { jax = "==0.7.2" }

[feature.cuda]
system-requirements = { cuda = "12", libc = "2.17" }
platforms = ["linux-64", "linux-aarch64"]
dependencies = { cuda = ">=12.0, <13.0" }

[feature.cuda.pypi-dependencies]
jax = { version = "<=0.7.2", extras = ["cuda12"] }

[feature.cuda.tasks]
build-mpi4jax = "pip uninstall -y mpi4jax; pip install --no-build-isolation 'mpi4jax>=0.8.1,<0.9'"

[environments]
default = { features = ["cpu"] }
cuda = { features = ["cuda"] }
