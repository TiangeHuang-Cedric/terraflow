[workspace]
name = "terraflow"
channels = ["pypi", "conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
python = ">=3.11, <3.12"
pip = "*"
bokeh = "==3.8"
cartopy = ">=0.25.0, <1.0"
easygems = ">=0.1.2"
holoviews = ">=1.21.0, <=1.22.0"
ipykernel = ">=7.1.0"
jax = "==0.7.2"
panel = "==1.8.0"
uxarray = "==2025.11.0"

[pypi-dependencies]
equinox = ">=0.13.2"
jaxtyping = ">=0.3.4"
jupytext = ">=1.18.1"
loguru = ">=0.7.3"
netcdf4 = ">=1.7.3"
numpy = ">=2.2.6, <2.3"
polars = ">=1.36.1"
pytest = ">=9.0.2"
quadax = ">=0.2.11"
tree-math = ">=0.2.1"
unxt = "==1.7.7"
xarray = ">=2025.12.0"
