[workspace]
name = "terraflow"
channels = ["pypi", "conda-forge"]
requires-pixi = ">=0.71.0"
platforms = [
    { name = "osx-arm64-macos-14", platform = "osx-arm64", macos = "14.0" },
    { name = "linux-64-cuda-12-glibc-2-28", platform = "linux-64", cuda = "12", glibc = "2.28" },
    { name = "linux-aarch64-cuda-12-glibc-2-28", platform = "linux-aarch64", cuda = "12", glibc = "2.28" },
    { name = "linux-64-glibc-2-28", platform = "linux-64", glibc = "2.28" },
    { name = "linux-aarch64-glibc-2-28", platform = "linux-aarch64", glibc = "2.28" },
]

[dependencies]
bokeh = ">=3.9.2,<4"
cartopy = ">=0.25.0,<0.26"
easygems = ">=0.2.1,<0.3"
holoviews = ">=1.21.0"
ipykernel = ">=7.3.0,<8"
netcdf4 = ">=1.7.2,<2"
numba = ">=0.66.0,<0.67"
panel = ">=1.9.3,<2"
pip = ">=26.2.1,<27"
python = ">=3.12,<3.13"
setuptools = ">=80,<83"
setuptools-git-versioning = ">=3,<4"
uxarray = "==2026.08.1"
wheel = ">=0.45,<0.46"
xarray = "==2025.9.0"
pint = ">=0.25.3,<0.26"

[pypi-dependencies]
jaxtyping = ">=0.3.11, <0.4"
jupytext = ">=1.19.5, <2"
loguru = ">=0.7.3, <=0.8"
nanobind = ">=2.14.0, <3"
numpy = "*"
polars = "*"
pymetis = ">=2025.2.2, <2026"
pytest = ">=9.1.1, <10"

[tasks]
build-dev = { cmd = "python -m pip install --no-build-isolation -e ." }
build-esmpy = { cmd = "python tools/build_esmpy.py" }
check-esmpy = { cmd = "python tools/build_esmpy.py --check-only --check-mpi" }
build-mpi4py = { cmd = "python tools/build_mpi4py.py" }

[feature.cpu]
platforms = ["osx-arm64-macos-14", "linux-64-glibc-2-28", "linux-aarch64-glibc-2-28"]

[feature.cpu.pypi-dependencies]
equinox = ">=0.13.8, <0.14"
quadax = ">=0.2.13, <0.3"

[feature.cpu.target.osx-arm64.pypi-dependencies]
jax = "==0.10.2"

[feature.cpu.tasks]
install-xprof = { cmd = "python -m pip install --no-cache-dir xprof", clean-env = true }
build-mpi4jax = { cmd = "MPI4JAX_USE_CUDA_MPI=${MPI4JAX_USE_CUDA_MPI:-0} python tools/build_mpi4jax.py" }
build-deps = { depends-on = ["build-dev"] }
build-optional-deps = { depends-on = ["build-esmpy", "build-mpi4py", "build-mpi4jax"] }

[feature.metal]
platforms = ["osx-arm64-macos-14", "linux-64-glibc-2-28", "linux-aarch64-glibc-2-28"]

[feature.metal.pypi-dependencies]
equinox = ">=0.13.8, <0.14"
quadax = ">=0.2.13, <0.3"

[feature.metal.target.osx-arm64.pypi-dependencies]
jax = "==0.10.2"
jax-mps = "==0.10.10"

[feature.metal.tasks]
install-xprof = { cmd = "python -m pip install --no-cache-dir xprof", clean-env = true }
build-mpi4jax = { cmd = "MPI4JAX_USE_CUDA_MPI=${MPI4JAX_USE_CUDA_MPI:-0} python tools/build_mpi4jax.py" }
build-deps = { depends-on = ["build-dev"] }
build-optional-deps = { depends-on = ["build-esmpy", "build-mpi4py", "build-mpi4jax"] }

[feature.cuda]
platforms = ["linux-64-cuda-12-glibc-2-28", "linux-aarch64-cuda-12-glibc-2-28"]
dependencies = { cuda = ">=12.1.1,<13" }

[feature.cuda.pypi-dependencies]
equinox = ">=0.13.8, <0.14"
jax = { version = "==0.10.2", extras = ["cuda12"] }
jaxlib = "==0.10.2"
jax-cuda12-plugin = { version = "==0.10.2", extras = ["with-cuda"] }
jax-cuda12-pjrt = "==0.10.2"
quadax = ">=0.2.13, <0.3"

[feature.cuda.tasks]
install-xprof = { cmd = "python -m pip install --no-cache-dir xprof", clean-env = true }
build-mpi4jax = { cmd = "MPI4JAX_USE_CUDA_MPI=${MPI4JAX_USE_CUDA_MPI:-1} python tools/build_mpi4jax.py" }
build-deps = { depends-on = ["build-dev"] }
build-optional-deps = { depends-on = ["build-esmpy", "build-mpi4py", "build-mpi4jax"] }

[feature.torch]
platforms = [
    "osx-arm64-macos-14",
    "linux-64-cuda-12-glibc-2-28",
    "linux-aarch64-cuda-12-glibc-2-28",
    "linux-64-glibc-2-28",
    "linux-aarch64-glibc-2-28"
]
dependencies = { pytorch = ">=2.5, <3", torchquad = ">=0.6.0,<0.7" }

[feature.torch.target."*-cuda-*".dependencies]
pytorch-gpu = "*"
cuda-version = "12.*"

[feature.torch.target."linux-64-cuda-*".dependencies]
cuda-driver-dev_linux-64 = ">=12,<13"
cuda-cudart-dev_linux-64 = ">=12,<13"

[feature.torch.target."linux-aarch64-cuda-*".dependencies]
cuda-driver-dev_linux-aarch64 = ">=12,<13"
cuda-cudart-dev_linux-aarch64 = ">=12,<13"

[feature.torch.tasks]
build-deps = { depends-on = ["build-dev"] }
build-optional-deps = { depends-on = ["build-esmpy", "build-mpi4py"] }

[environments]
default = { features = ["cpu", "torch"] }
cpu = { features = ["cpu"] }
metal = { features = ["metal"] }
cuda = { features = ["cuda"] }
torch = { features = ["torch"] }
