[project]
name = "terraflow"
version = "0.1.0"
description = "A package for simulating atmosphere/ocean on earth"
readme = "README.md"
authors = [{ name = "Tiange Huang", email = "tghuang@mail.ustc.edu.cn" }]
requires-python = ">=3.12, <3.13"
dependencies = []

[project.entry-points."terraflow.registrations"]
equterm = "terraflow.manager.plugins.equterm.registrations:register"
equaux = "terraflow.manager.plugins.equaux.registrations:register"
diag = "terraflow.manager.plugins.diag.registrations:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
