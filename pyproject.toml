[project]
name = "terraflow"
version = "0.1.0"
description = "A package for simulating atmosphere/ocean on earth"
readme = "README.md"
authors = [{ name = "Tiange Huang", email = "tghuang@mail.ustc.edu.cn" }]
requires-python = ">=3.11, <3.12"
dependencies = []

[project.entry-points."terraflow.registrations"]
method = "terraflow.manager.plugins.method.registrations:register"
layout = "terraflow.manager.plugins.layout.registrations:register"
mesh = "terraflow.manager.plugins.mesh.registrations:register"
vert = "terraflow.manager.plugins.vert.registrations:register"
op = "terraflow.manager.plugins.op.registrations:register"
equset = "terraflow.manager.plugins.equset.registrations:register"
equ = "terraflow.manager.plugins.equ.registrations:register"
term = "terraflow.manager.plugins.term.registrations:register"
diag = "terraflow.manager.plugins.diag.registrations:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
